use_case: resume
paths:
  data_dir: data
  db: data/app.db
ingestion:
  max_file_mb: 10
  max_pages: 10
parser:
  default: pymupdf4llm      # digital PDFs, incl. two-column (column-aware, no ML)
  docx: python_docx
  fallback: null            # "docling" = heavy retry for unusable results (needs torch)
  ocr: tesseract            # used only by the fallback parser
  vlm_fallback: {enabled: false, model: "qwen2.5vl:7b"}
  min_chars_per_page: 50
llm:
  provider: ollama
  model: "qwen2.5:7b"
  temperature: 0
embedding:
  models:
    - {provider: sentence_transformers, name: BAAI/bge-small-en-v1.5}
    # Optional challenger (runs inside Ollama, not this process; needs `ollama pull`):
    # - {provider: ollama, name: nomic-embed-text}
  default: BAAI/bge-small-en-v1.5
  batch_size: 32
  device: null              # "cpu" to force CPU
chunking:
  strategy: section_entry
  model_limit: 512          # smallest max_tokens among embedding.models (shared chunks)
  budgets:
    mode: adaptive_per_section
    p_low: 20
    p_high: 90
    min_clamp: [64, 128]
    max_clamp: [256, null]
    prefix_reserve: 32
    min_units: 10           # fewer units than this per section type -> fixed defaults
    default_max: 400
    growth_trigger: 0.5     # recompute budgets when the corpus grows by 50%
vector_store: {provider: faiss, index: flat_ip}
keyword: {provider: bm25s, tokenizer: tech_aware}
metadata:
  use_llm: false            # true = Ollama resolves title/company for ambiguous entries only
  as_of: null               # date "Present" resolves to; null = today
  gap_months: 3             # career gaps longer than this are reported
logging:
  level: INFO
