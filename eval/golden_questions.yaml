# Seed golden questions for the nine synthetic fixture resumes (tests/fixtures/specs).
#
# Labelled by EVIDENCE, never by chunk id: `quote` must appear verbatim in a chunk of that
# candidate (checked by tests/integration/test_golden_questions.py). Phase 3 resolves quotes to
# chunk ids at eval time, so re-chunking never invalidates the labels.
#   grade 2 = the quote answers the question, grade 1 = partially relevant
#   answerable: false = no candidate has the information (the assistant must say so)
#   intent: skill_lookup | experience_depth | structured | compare | jd_match | negative | adversarial
# Candidates are fixture ids: priya=single_col_backend, elena=single_col_gap, marcus=single_col_overlap,
# tomas=single_col_no_headings, lucia=single_col_spanish, aisha=two_col_sidebar,
# kenji=two_col_sidebar_right, sofia=docx_frontend, rahul=scanned_devops.

