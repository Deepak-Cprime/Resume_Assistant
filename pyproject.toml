[project]
name = "resume-rag-assistant"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = '-m "not slow and not ollama and not models and not accuracy" -ra'
markers = [
    "slow: slow parsers such as Docling",
    "integration: full pipeline over the fixture corpus",
    "ollama: needs a running Ollama server",
    "models: needs downloaded embedding models",
    "accuracy: metadata accuracy vs ground truth (needs Ollama)",
    "ui: Streamlit AppTest smoke tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Streamlit pages put the project root on sys.path before importing `src`.
"app/**" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
